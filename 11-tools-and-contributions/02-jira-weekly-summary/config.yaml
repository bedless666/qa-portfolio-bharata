# JIRA Weekly Summary - Configuration File (sanitized for public portfolio)
# Replace placeholders with your own Jira filter IDs, webhook tokens, and team emails.

jira:
  api_url: "https://jira.company.example/rest/api/2/search"
  pat_token: "YOUR_JIRA_PAT_TOKEN_HERE"
  fields:
    - "key"
    - "summary"
    - "status"
    - "assignee"
    - "updated"
  max_results: 100

teams:
  all_teams:
    jira_filter: 100001
    webhook_test: "YOUR_TEST_WEBHOOK_TOKEN"
    webhook_production: "YOUR_PRODUCTION_WEBHOOK_TOKEN"

    message1:
      subteam_name: "Buyer and Seller Fulfillment"
      buyer:
        name: "Buyer"
        emoji: "🛒"
        members:
          - "qa.member01@company.example"
          - "qa.member02@company.example"
          - "qa.member03@company.example"

      seller_fulfillment:
        name: "Seller-Fulfillment"
        emoji: "📦"
        members:
          - "qa.member04@company.example"
          - "qa.member05@company.example"
          - "qa.member06@company.example"
          - "qa.member07@company.example"
          - "qa.member08@company.example"

    message2:
      subteam_name: "Order Ops and Promotion"
      order_ops:
        name: "Order Ops"
        emoji: "📋"
        members:
          - "qa.member09@company.example"
          - "qa.member10@company.example"
          - "qa.member11@company.example"
          - "qa.member12@company.example"

      promotion:
        name: "Promotion"
        emoji: "🎯"
        members:
          - "qa.member13@company.example"
          - "qa.member14@company.example"
          - "qa.member15@company.example"

  promotion:
    jira_filter: 100002
    webhook_test: "YOUR_TEST_WEBHOOK_TOKEN"
    webhook_production: "YOUR_PROMOTION_WEBHOOK_TOKEN"
    members:
      - "qa.member14@company.example"
      - "qa.member15@company.example"
      - "qa.member13@company.example"

  buyer:
    jira_filter: 100003
    webhook_test: "YOUR_TEST_WEBHOOK_TOKEN"
    webhook_production: "YOUR_BUYER_WEBHOOK_TOKEN"
    members:
      - "qa.member01@company.example"
      - "qa.member02@company.example"
      - "qa.member03@company.example"

  seller_fulfillment:
    jira_filter: 100004
    webhook_test: "YOUR_TEST_WEBHOOK_TOKEN"
    webhook_production: "YOUR_SELLER_FULFILLMENT_WEBHOOK_TOKEN"
